<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo Vascular HSJD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        // === FIREBASE CONFIGURACIÓN INTEGRADA ===
        const firebaseConfig = {
          apiKey: "AIzaSyD6cmfArqhgLdW0dn_NAIT9CUMBcT5rW1U",
          authDomain: "censo-vascular-hsjd.firebaseapp.com",
          projectId: "censo-vascular-hsjd",
          storageBucket: "censo-vascular-hsjd.firebasestorage.app",
          messagingSenderId: "330248761061",
          appId: "1:330248761061:web:852e3b43fec2f8b83fae0c"
        };
        // =====================================

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.fb = { collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [usuario, setUsuario] = useState(null);
            const [pinInput, setPinInput] = useState("");
            const [medicoSeleccionado, setMedicoSeleccionado] = useState("");
            const [camas, setCamas] = useState([]);
            const [camaActiva, setCamaActiva] = useState(null); // null = listado, {} = nueva, {...} = editando
            
            // Catálogo actualizado
            const medicos = ["Dr. Rojas (Jefatura a.i.)", "Dr. Cabezas", "Dr. Asistente 1", "Dra. Residente 1", "Dr. Residente 2"];
            const servicios = ["Cirugía General", "Ortopedia", "Medicina Interna", "Emergencias", "Urología", "Neurocirugía", "Ginecología"];
            const PIN_CORRECTO = "1234"; 

            // Conexión a Firebase para lectura en tiempo real
            useEffect(() => {
                if (usuario && window.fb) {
                    const unsubscribe = window.fb.onSnapshot(window.fb.collection(window.db, "camas"), (snapshot) => {
                        const camasData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        setCamas(camasData);
                    });
                    return () => unsubscribe();
                }
            }, [usuario]);

            const guardarCama = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const datos = Object.fromEntries(formData.entries());
                
                datos.diasPreOp = Number(datos.diasPreOp);
                datos.diasPostOp = Number(datos.diasPostOp);
                datos.ultimoUsuario = usuario;
                datos.ultimaActualizacion = window.fb.serverTimestamp();

                try {
                    if (camaActiva.id) {
                        await window.fb.setDoc(window.fb.doc(window.db, "camas", camaActiva.id), datos, { merge: true });
                    } else {
                        await window.fb.addDoc(window.fb.collection(window.db, "camas"), datos);
                    }
                    setCamaActiva(null);
                } catch (error) {
                    alert("Error al guardar: Verifique la conexión a la base de datos.");
                    console.error(error);
                }
            };

            const eliminarCama = async (id) => {
                if(confirm("¿Está seguro de liberar/eliminar esta cama del censo?")) {
                    await window.fb.deleteDoc(window.fb.doc(window.db, "camas", id));
                }
            };

            if (!usuario) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-slate-800">
                        <div className="bg-white p-8 rounded-lg shadow-lg w-96 text-center">
                            <h1 className="text-2xl font-bold mb-2 text-blue-900">Hospital San Juan de Dios</h1>
                            <h2 className="text-lg mb-6 text-gray-600">Censo Cirugía Vascular</h2>
                            
                            <select className="w-full p-2 mb-4 border rounded" value={medicoSeleccionado} onChange={(e) => setMedicoSeleccionado(e.target.value)}>
                                <option value="">Seleccione Médico...</option>
                                {medicos.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>

                            <input type="password" placeholder="PIN de 4 dígitos" className="w-full p-2 mb-4 border rounded text-center tracking-widest text-lg" maxLength="4" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />

                            <button className="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700"
                                onClick={() => {
                                    if(medicoSeleccionado && pinInput === PIN_CORRECTO) setUsuario(medicoSeleccionado);
                                    else alert("PIN incorrecto o médico no seleccionado");
                                }}>
                                Entrar al Censo
                            </button>
                        </div>
                    </div>
                );
            }

            // Vista del Formulario Modal (Agregar/Editar)
            if (camaActiva) {
                return (
                    <div className="p-4 max-w-2xl mx-auto">
                        <div className="bg-white p-6 rounded shadow">
                            <h2 className="text-2xl font-bold mb-4">{camaActiva.id ? "Editar Cama" : "Nueva Cama"}</h2>
                            <form onSubmit={guardarCama} className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                
                                <div>
                                    <label className="block text-sm font-bold mb-1">Número de Cama / Ubicación</label>
                                    <input name="numeroCama" defaultValue={camaActiva.numeroCama} required className="w-full p-2 border rounded" placeholder="Ej. 401 - Salón Hombres" />
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-1">Estado de Ocupación (Invasiones)</label>
                                    <select name="estadoInvasion" defaultValue={camaActiva.estadoInvasion || "Propia de Vascular"} className="w-full p-2 border rounded">
                                        <option value="Propia de Vascular">Propia de Vascular (Ocupada por Vascular)</option>
                                        <option value="Invasión Recibida">Invasión Recibida (Cama nuestra, otro servicio)</option>
                                        <option value="Invasión Ejercida">Invasión Ejercida (Cama ajena, pte. nuestro)</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-1">Servicio Involucrado (Si hay invasión)</label>
                                    <select name="servicioInvolucrado" defaultValue={camaActiva.servicioInvolucrado || "N/A"} className="w-full p-2 border rounded">
                                        <option value="N/A">N/A</option>
                                        {servicios.map(s => <option key={s} value={s}>{s}</option>)}
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-1">Origen de Ingreso</label>
                                    <select name="origen" defaultValue={camaActiva.origen || "Emergencias"} className="w-full p-2 border rounded">
                                        <option value="Emergencias">Emergencias</option>
                                        <option value="Consulta Externa">Consulta Externa</option>
                                        <option value="Traslado otro hospital">Traslado de otro hospital</option>
                                    </select>
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-1">Días Pre-Operatorios</label>
                                    <input name="diasPreOp" type="number" min="0" defaultValue={camaActiva.diasPreOp || 0} required className="w-full p-2 border rounded" />
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-1">Días Post-Operatorios</label>
                                    <input name="diasPostOp" type="number" min="0" defaultValue={camaActiva.diasPostOp || 0} required className="w-full p-2 border rounded" />
                                </div>

                                <div>
                                    <label className="block text-sm font-bold mb-1">Lista de Espera</label>
                                    <select name="listaEspera" defaultValue={camaActiva.listaEspera || "No"} className="w-full p-2 border rounded">
                                        <option value="Sí">Sí, pendiente</option>
                                        <option value="No">No aplica</option>
                                    </select>
                                </div>

                                <div className="md:col-span-2">
                                    <label className="block text-sm font-bold mb-1">Diagnóstico Principal</label>
                                    <input name="diagnostico" defaultValue={camaActiva.diagnostico} required className="w-full p-2 border rounded" placeholder="Ej. Pie diabético Wagner 3" />
                                </div>

                                <div className="md:col-span-2 flex justify-end gap-2 mt-4">
                                    <button type="button" onClick={() => setCamaActiva(null)} className="bg-gray-300 px-4 py-2 rounded font-bold hover:bg-gray-400">Cancelar</button>
                                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded font-bold hover:bg-blue-700">Guardar Cama</button>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            // Vista Principal (Listado)
            return (
                <div className="p-4 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
                        <div>
                            <h1 className="text-xl font-bold text-blue-900">Censo Activo - Cirugía Vascular</h1>
                            <span className="text-sm font-semibold text-gray-700">Usuario en turno: {usuario}</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => setCamaActiva({})} className="bg-green-600 text-white px-4 py-2 rounded font-bold text-sm hover:bg-green-700">
                                + Agregar Cama
                            </button>
                            <button onClick={() => { setUsuario(null); setPinInput(""); }} className="bg-red-500 text-white px-4 py-2 rounded font-bold text-sm hover:bg-red-600">
                                Cerrar Sesión
                            </button>
                        </div>
                    </div>

                    {camas.length === 0 ? (
                        <div className="text-center p-8 bg-white rounded shadow text-gray-500">No hay camas registradas en el censo. Haga clic en "+ Agregar Cama".</div>
                    ) : (
                        <div className="grid gap-4">
                            {camas.map(cama => (
                                <div key={cama.id} className={`bg-white p-4 rounded shadow border-l-4 ${cama.estadoInvasion === 'Propia de Vascular' ? 'border-blue-500' : 'border-orange-500'}`}>
                                    <div className="flex justify-between items-start">
                                        <h3 className="font-bold text-lg">{cama.numeroCama}</h3>
                                        <div className="flex gap-2">
                                            <button onClick={() => setCamaActiva(cama)} className="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-semibold hover:bg-blue-200">Editar</button>
                                            <button onClick={() => eliminarCama(cama.id)} className="bg-red-100 text-red-700 px-3 py-1 rounded text-sm font-semibold hover:bg-red-200">Liberar</button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 text-sm">
                                        <div className="col-span-2">
                                            <strong>Estado Administrativo: </strong> 
                                            <span className={cama.estadoInvasion !== 'Propia de Vascular' ? 'text-orange-600 font-bold' : ''}>
                                                {cama.estadoInvasion} {cama.servicioInvolucrado !== 'N/A' && `(${cama.servicioInvolucrado})`}
                                            </span>
                                        </div>
                                        <div><strong>Origen:</strong> {cama.origen}</div>
                                        <div><strong>Lista Espera:</strong> {cama.listaEspera}</div>
                                        <div><strong>Días Pre-Op:</strong> {cama.diasPreOp}</div>
                                        <div><strong>Días Post-Op:</strong> {cama.diasPostOp}</div>
                                        <div className="col-span-2 md:col-span-4"><strong>Diagnóstico:</strong> {cama.diagnostico}</div>
                                        <div className="col-span-2 md:col-span-4 text-xs text-gray-400">
                                            Última modificación por: {cama.ultimoUsuario}
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
