<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo Vascular HSJD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100 font-sans">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD6cmfArqhgLdW0dn_NAIT9CUMBcT5rW1U",
          authDomain: "censo-vascular-hsjd.firebaseapp.com",
          projectId: "censo-vascular-hsjd",
          storageBucket: "censo-vascular-hsjd.firebasestorage.app",
          messagingSenderId: "330248761061",
          appId: "1:330248761061:web:852e3b43fec2f8b83fae0c"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.fb = { collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [usuario, setUsuario] = useState(null);
            const [pinInput, setPinInput] = useState("");
            const [medicoSeleccionado, setMedicoSeleccionado] = useState("");
            const [camas, setCamas] = useState([]);
            const [camaSeleccionada, setCamaSeleccionada] = useState(null);
            const [busqueda, setBusqueda] = useState("");
            const [estadoSeleccionado, setEstadoSeleccionado] = useState("");
            const [gestionandoMedicos, setGestionandoMedicos] = useState(false);
            
            const [medicos, setMedicos] = useState([
                "Dr. Cabezas Loría",
                "Dr. Castillo Amoretti",
                "Dr. Cruz Guzmán",
                "Dr. Giraldo Noguera",
                "Dra. Herrera Garrido",
                "Dra. Leitón Solano",
                "Dra. Méndez Marín",
                "Dr. Meza Aguilar",
                "Dra. Min Kim",
                "Dr. Moreno Arroyo",
                "Dr. Rojas Vázquez",
                "Dra. Rodríguez Rojas",
                "Dra. Sandí Ovares",
                "Dr. Sandoval Alfaro",
                "Dra. Secades Mesén",
                "Dra. Zúñiga Villegas"
            ]);
            const [nuevoMedicoInput, setNuevoMedicoInput] = useState("");

            const PIN_CORRECTO = "1234"; 

            const salonesLista = [
                "Cirugía Mujeres", "Cirugía Hombres", "UEQ", "Urología", 
                "Oncología Mujeres", "Oncología Hombres", "Ortopedia", 
                "UCI Central", "UCI Qx", "UCI Neura", "Ginecología", "Medicina"
            ];

            const serviciosBase = [
                "UEQ", "Ortopedia", "Urología", "Cirugía General", 
                "Cirugía Tórax", "Neurocirugía", "Cirugía Cardíaca", 
                "Cirugía Plástica", "ORL", "Oftalmología", "Otro"
            ];

            const diagnosticosBase = [
                "Pie Diabético", "Aneurisma de Aorta", "Isquemia Aguda", 
                "Isquemia Crónica", "Trombosis Venosa Profunda aguda", 
                "Trauma Vascular", "Tromboembolismo Pulmonar", 
                "Acceso Vascular Hemodiálisis", "Várices Miembros inferiores", 
                "Opérculo Torácico", "Trombosis Venosa Profunda crónica", "Otro"
            ];

            const motivosInhabilitacion = [
                "Aislamiento por brote infeccioso", 
                "Remodelación/Mantenimiento", 
                "Avería de mobiliario", 
                "Limpieza/Desinfección"
            ];

            // 10 Camas Propias obligatorias de Vascular
            const camasInicialesVascular = [
                { numeroCama: "607", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "608", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "609", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "610", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "611", salon: "Cirugía Mujeres", tipoCama: "Propia Aorta", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "562", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "563", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "564", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "565", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "566", salon: "Cirugía Hombres", tipoCama: "Propia Aorta", estadoCama: "Libre", paciente: "", idPaciente: "" }
            ];

            useEffect(() => {
                if (usuario && window.fb) {
                    const unsubscribe = window.fb.onSnapshot(window.fb.collection(window.db, "camas_vascular"), (snapshot) => {
                        const camasData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (camasData.length === 0) {
                            camasInicialesVascular.forEach(async (cama) => {
                                await window.fb.addDoc(window.fb.collection(window.db, "camas_vascular"), {
                                    ...cama,
                                    ultimoUsuario: "Sistema"
                                });
                            });
                        } else {
                            setCamas(camasData);
                            if (!camaSeleccionada && camasData.length > 0) {
                                setCamaSeleccionada(camasData[0]);
                            }
                        }
                    });
                    return () => unsubscribe();
                }
            }, [usuario]);

            // Cálculo exacto de días internamiento y postquirúrgicos
            const calcularDias = (fechaIngreso, fechaCirugia) => {
                if (!fechaIngreso) return { diasInternamiento: 0, diasPostOp: "N/A" };
                const hoy = new Date();
                hoy.setHours(0,0,0,0);
                const ingreso = new Date(fechaIngreso);
                ingreso.setHours(0,0,0,0);

                const diffIngresoMs = hoy - ingreso;
                const diasInternamiento = Math.max(1, Math.floor(diffIngresoMs / (1000 * 60 * 60 * 24)) + 1);

                if (!fechaCirugia) {
                    return { diasInternamiento, diasPostOp: "N/A" };
                }

                const cirugia = new Date(fechaCirugia);
                cirugia.setHours(0,0,0,0);

                if (hoy < cirugia) {
                    return { diasInternamiento, diasPostOp: "Pendiente" };
                } else if (hoy.getTime() === cirugia.getTime()) {
                    return { diasInternamiento, diasPostOp: 0 };
                } else {
                    const diasPost = Math.floor((hoy - cirugia) / (1000 * 60 * 60 * 24));
                    return { diasInternamiento, diasPostOp: Math.max(1, diasPost) };
                }
            };

            const guardarCama = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const datos = Object.fromEntries(formData.entries());

                const calculo = calcularDias(datos.fechaIngresoSalon, datos.fechaPrimeraCirugia);
                datos.diasPreOp = calculo.diasInternamiento;
                datos.diasPostOp = calculo.diasPostOp;
                datos.ultimoUsuario = usuario;
                datos.ultimaActualizacion = window.fb.serverTimestamp();

                try {
                    if (camaSeleccionada.id) {
                        await window.fb.setDoc(window.fb.doc(window.db, "camas_vascular", camaSeleccionada.id), datos, { merge: true });
                    } else {
                        const docRef = await window.fb.addDoc(window.fb.collection(window.db, "camas_vascular"), datos);
                        setCamaSeleccionada({ id: docRef.id, ...datos });
                    }
                    alert("Cama guardada correctamente.");
                } catch (error) {
                    alert("Error al guardar en la base de datos.");
                    console.error(error);
                }
            };

            const agregarCamaExtra = async () => {
                const nueva = {
                    numeroCama: "Nueva",
                    salon: "Cirugía Mujeres",
                    tipoCama: "Invasión Ejercida",
                    estadoCama: "Invasión Ejercida por Vascular",
                    paciente: "Nuevo Paciente",
                    idPaciente: "",
                    modalidadIngreso: "Emergencias",
                    listaEspera: "No",
                    diagnostico: "Pie Diabético",
                    fechaIngresoSalon: new Date().toISOString().split('T')[0],
                    fechaPrimeraCirugia: "",
                    ultimoUsuario: usuario
                };
                const docRef = await window.fb.addDoc(window.fb.collection(window.db, "camas_vascular"), nueva);
                setCamaSeleccionada({ id: docRef.id, ...nueva });
            };

            const obtenerColorEstado = (estado) => {
                switch(estado) {
                    case "Ocupada por Vascular": return "bg-[#cfe2f3] border-l-blue-500 text-blue-950";
                    case "Invasión Ejercida por Vascular": return "bg-[#cbf7f7] border-l-cyan-500 text-cyan-950";
                    case "Invadida por otro servicio": return "bg-[#d9ead3] border-l-emerald-500 text-emerald-950";
                    case "Libre": return "bg-[#fff2cc] border-l-yellow-500 text-yellow-950";
                    case "Desocupada": return "bg-[#f4cccc] border-l-pink-500 text-pink-950";
                    case "Inhabilitada": return "bg-[#fce5cd] border-l-orange-500 text-orange-950";
                    default: return "bg-white border-l-gray-300 text-gray-900";
                }
            };

            if (!usuario) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-slate-900 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
                            <h1 className="text-xl font-bold mb-1 text-blue-900 text-center">Hospital San Juan de Dios</h1>
                            <h2 className="text-md font-semibold mb-6 text-gray-600 text-center">Censo Cirugía Vascular</h2>
                            
                            <div className="mb-4 flex justify-between items-center">
                                <label className="text-sm font-bold text-gray-700">Seleccione Médico:</label>
                                <button onClick={() => setGestionandoMedicos(!gestionandoMedicos)} className="text-xs text-blue-600 font-semibold hover:underline">
                                    {gestionandoMedicos ? "Ocultar gestión" : "Gestionar médicos (Rotaciones)"}
                                </button>
                            </div>

                            {gestionandoMedicos && (
                                <div className="mb-4 p-3 bg-gray-50 rounded-lg border text-sm">
                                    <p className="text-xs text-gray-500 mb-2">Agregue o elimine médicos para las rotaciones mensuales:</p>
                                    <div className="flex gap-2 mb-2">
                                        <input type="text" placeholder="Ej. Dr. Nuevo Médico" value={nuevoMedicoInput} onChange={(e) => setNuevoMedicoInput(e.target.value)} className="w-full p-1.5 border rounded text-xs" />
                                        <button onClick={() => {
                                            if(nuevoMedicoInput.trim()) {
                                                const actualizado = [...medicos, nuevoMedicoInput.trim()].sort();
                                                setMedicos(actualizado);
                                                setNuevoMedicoInput("");
                                            }
                                        }} className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">+</button>
                                    </div>
                                    <div className="max-h-32 overflow-y-auto space-y-1">
                                        {medicos.map((m, idx) => (
                                            <div key={idx} className="flex justify-between items-center bg-white p-1 rounded border text-xs">
                                                <span>{m}</span>
                                                <button onClick={() => setMedicos(medicos.filter(item => item !== m))} className="text-red-600 font-bold px-1">×</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <select className="w-full p-3 mb-4 border rounded-lg bg-gray-50" value={medicoSeleccionado} onChange={(e) => setMedicoSeleccionado(e.target.value)}>
                                <option value="">Seleccione Médico...</option>
                                {medicos.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>

                            <input type="password" placeholder="PIN de 4 dígitos" className="w-full p-3 mb-6 border rounded-lg text-center tracking-widest text-lg bg-gray-50" maxLength="4" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />

                            <button className="w-full bg-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-800 transition"
                                onClick={() => {
                                    if(medicoSeleccionado && pinInput === PIN_CORRECTO) setUsuario(medicoSeleccionado);
                                    else alert("PIN incorrecto o médico no seleccionado");
                                }}>
                                Ingresar al Censo
                            </button>
                        </div>
                    </div>
                );
            }

            const camasFiltradas = camas.filter(c => 
                (c.paciente && c.paciente.toLowerCase().includes(busqueda.toLowerCase())) ||
                (c.numeroCama && c.numeroCama.toLowerCase().includes(busqueda.toLowerCase())) ||
                (c.salon && c.salon.toLowerCase().includes(busqueda.toLowerCase()))
            );

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                    {/* Barra Superior estilo Power Apps */}
                    <header className="bg-[#0078D4] text-white p-4 shadow flex justify-between items-center">
                        <h1 className="text-xl font-bold tracking-wide">Censo_Camas_Vascular</h1>
                        <div className="flex items-center gap-4">
                            <span className="text-sm bg-white/10 px-3 py-1 rounded">Dr(a). {usuario}</span>
                            <button onClick={() => { setUsuario(null); setPinInput(""); }} className="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm font-bold transition">
                                Salir
                            </button>
                        </div>
                    </header>

                    {/* Contenedor Principal en Dos Columnas (Estilo Power Apps) */}
                    <div className="flex-1 max-w-7xl w-full mx-auto p-4 grid grid-cols-1 md:grid-cols-12 gap-6">
                        
                        {/* COLUMNA IZQUIERDA: Listado y Buscador */}
                        <div className="md:col-span-5 bg-white rounded-lg shadow p-4 flex flex-col h-[calc(100vh-120px)]">
                            <div className="mb-4">
                                <input 
                                    type="text" 
                                    placeholder="Buscar por paciente, cama o salón..." 
                                    value={busqueda} 
                                    onChange={(e) => setBusqueda(e.target.value)}
                                    className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 focus:bg-white transition"
                                />
                            </div>

                            <div className="flex gap-2 mb-4">
                                <button onClick={agregarCamaExtra} className="flex-1 bg-[#0078D4] hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-lg text-sm shadow transition flex items-center justify-center gap-1">
                                    <span className="text-lg">+</span> Cama Extra
                                </button>
                            </div>

                            <div className="flex-1 overflow-y-auto space-y-3 pr-1">
                                {camasFiltradas.map(cama => {
                                    const esSeleccionada = camaSeleccionada && camaSeleccionada.id === cama.id;
                                    const colorClase = obtenerColorEstado(cama.estadoCama);
                                    const calc = calcularDias(cama.fechaIngresoSalon, cama.fechaPrimeraCirugia);

                                    return (
                                        <div 
                                            key={cama.id} 
                                            onClick={() => setCamaSeleccionada(cama)}
                                            className={`p-3.5 rounded-lg border-l-8 shadow-sm cursor-pointer transition transform active:scale-95 ${colorClase} ${esSeleccionada ? 'ring-2 ring-blue-600 shadow-md' : 'hover:opacity-90'}`}
                                        >
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <h4 className="font-bold text-gray-900 text-base">{cama.paciente || <span className="text-gray-400 italic font-normal">Sin asignar (Cama {cama.numeroCama})</span>}</h4>
                                                    <div className="text-xs font-semibold text-gray-700 mt-0.5 flex gap-2">
                                                        <span>Cama: <strong className="text-sm font-extrabold">{cama.numeroCama}</strong></span>
                                                        <span>• {cama.salon}</span>
                                                    </div>
                                                    <div className="text-xs text-gray-600 font-mono mt-0.5">{cama.idPaciente || "Sin cédula"}</div>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-bold text-blue-900 block">Días internamiento:</span>
                                                    <span className="text-base font-extrabold text-blue-700">{calc.diasInternamiento}</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* COLUMNA DERECHA: Formulario de Edición Detallada */}
                        <div className="md:col-span-7 bg-white rounded-lg shadow p-6 h-[calc(100vh-120px)] overflow-y-auto">
                            {camaSeleccionada ? (
                                <form onSubmit={guardarCama} className="space-y-4">
                                    <div className="flex justify-between items-center border-b pb-3">
                                        <h2 className="text-xl font-bold text-blue-900">Editar Cama / Paciente</h2>
                                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-5 py-2 rounded-lg text-sm shadow transition">
                                            Guardar Cambios
                                        </button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Número de Cama</label>
                                            <input name="numeroCama" defaultValue={camaSeleccionada.numeroCama} required className="w-full p-2 border rounded-lg text-sm bg-gray-50 font-bold" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Salón</label>
                                            <select name="salon" defaultValue={camaSeleccionada.salon || salonesLista[0]} className="w-full p-2 border rounded-lg text-sm bg-gray-50">
                                                {salonesLista.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Estado de Cama</label>
                                            <select name="estadoCama" defaultValue={camaSeleccionada.estadoCama || "Libre"} onChange={(e) => setEstadoSeleccionado(e.target.value)} className="w-full p-2 border rounded-lg text-sm bg-gray-50 font-semibold">
                                                <option value="Ocupada por Vascular">Ocupada por Vascular</option>
                                                <option value="Invasión Ejercida por Vascular">Invasión Ejercida por Vascular</option>
                                                <option value="Invadida por otro servicio">Invadida por otro servicio</option>
                                                <option value="Libre">Libre</option>
                                                <option value="Desocupada">Desocupada</option>
                                                <option value="Inhabilitada">Inhabilitada</option>
                                            </select>
                                        </div>

                                        {/* Condicional Motivo Inhabilitación */}
                                        {(estadoSeleccionado === "Inhabilitada" || camaSeleccionada.estadoCama === "Inhabilitada") && (
                                            <div className="md:col-span-2 bg-orange-50 p-3 rounded-lg border border-orange-200">
                                                <label className="block text-xs font-bold text-orange-900 uppercase mb-1">Motivo de Inhabilitación</label>
                                                <select name="motivoInhabilitacion" defaultValue={camaSeleccionada.motivoInhabilitacion || motivosInhabilitacion[0]} className="w-full p-2 border rounded-lg text-sm bg-white">
                                                    {motivosInhabilitacion.map(m => <option key={m} value={m}>{m}</option>)}
                                                </select>
                                            </div>
                                        )}

                                        {/* Condicional Servicio Invasor */}
                                        {(estadoSeleccionado === "Invadida por otro servicio" || camaSeleccionada.estadoCama === "Invadida por otro servicio") && (
                                            <div className="md:col-span-2 bg-emerald-50 p-3 rounded-lg border border-emerald-200">
                                                <label className="block text-xs font-bold text-emerald-900 uppercase mb-1">Servicio que Invade</label>
                                                <select name="servicioInvasor" defaultValue={camaSeleccionada.servicioInvasor || serviciosBase[0]} className="w-full p-2 border rounded-lg text-sm bg-white">
                                                    {serviciosBase.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        )}

                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre de Paciente</label>
                                            <input name="paciente" defaultValue={camaSeleccionada.paciente} className="w-full p-2 border rounded-lg text-sm bg-gray-50" placeholder="Apellidos y Nombre" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Identificación / Expediente</label>
                                            <input name="idPaciente" defaultValue={camaSeleccionada.idPaciente} className="w-full p-2 border rounded-lg text-sm bg-gray-50 font-mono" placeholder="Cédula" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Diagnóstico</label>
                                            <select name="diagnostico" defaultValue={camaSeleccionada.diagnostico || diagnosticosBase[0]} className="w-full p-2 border rounded-lg text-sm bg-gray-50">
                                                {diagnosticosBase.map(d => <option key={d} value={d}>{d}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de Cama</label>
                                            <select name="tipoCama" defaultValue={camaSeleccionada.tipoCama || "Propia Regular"} className="w-full p-2 border rounded-lg text-sm bg-gray-50">
                                                <option value="Propia Regular">Propia Regular</option>
                                                <option value="Propia Aorta">Propia Aorta</option>
                                                <option value="Invasión Ejercida">Invasión Ejercida</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Modalidad de Ingreso</label>
                                            <select name="modalidadIngreso" defaultValue={camaSeleccionada.modalidadIngreso || "Emergencias"} className="w-full p-2 border rounded-lg text-sm bg-gray-50">
                                                <option value="Emergencias">Emergencias</option>
                                                <option value="Consulta Externa">Consulta Externa</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Fecha Ingreso a Salón</label>
                                            <input type="date" name="fechaIngresoSalon" defaultValue={camaSeleccionada.fechaIngresoSalon || ""} className="w-full p-2 border rounded-lg text-sm bg-gray-50" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Fecha Primera Cirugía</label>
                                            <input type="date" name="fechaPrimeraCirugia" defaultValue={camaSeleccionada.fechaPrimeraCirugia || ""} className="w-full p-2 border rounded-lg text-sm bg-gray-50" />
                                        </div>

                                        <div className="flex items-center justify-between p-3 bg-gray-50 rounded-lg border md:col-span-2">
                                            <div>
                                                <span className="text-xs font-bold text-gray-700 uppercase block">Lista de Espera</span>
                                                <span className="text-xs text-gray-500">¿Paciente pendiente de procedimiento quirúrgico?</span>
                                            </div>
                                            <select name="listaEspera" defaultValue={camaSeleccionada.listaEspera || "No"} className="p-1.5 border rounded text-sm font-bold bg-white">
                                                <option value="No">No</option>
                                                <option value="Sí">Sí</option>
                                            </select>
                                        </div>

                                        <div className="md:col-span-2 pt-2 text-xs text-gray-500 flex justify-between border-t">
                                            <span>Último usuario en modificar: <strong>{camaSeleccionada.ultimoUsuario || "N/A"}</strong></span>
                                            {camaSeleccionada.tipoCama !== "Propia Regular" && camaSeleccionada.tipoCama !== "Propia Aorta" && (
                                                <button type="button" onClick={async () => {
                                                    if(confirm("¿Eliminar esta cama extra / invasión ejercida?")) {
                                                        await window.fb.deleteDoc(window.fb.doc(window.db, "camas_vascular", camaSeleccionada.id));
                                                        setCamaSeleccionada(null);
                                                    }
                                                }} className="text-red-600 font-bold hover:underline">Eliminar Cama Extra</button>
                                            )}
                                        </div>
                                    </div>
                                </form>
                            ) : (
                                <div className="flex items-center justify-center h-full text-gray-400">
                                    Seleccione una cama de la lista izquierda para ver o editar sus detalles.
                                </div>
                            )}
                        </div>

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
