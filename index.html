<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo Vascular HSJD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
        }
    </style>
</head>
<body class="bg-gray-100 font-sans">
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyD6cmfArqhgLdW0dn_NAIT9CUMBcT5rW1U",
          authDomain: "censo-vascular-hsjd.firebaseapp.com",
          projectId: "censo-vascular-hsjd",
          storageBucket: "censo-vascular-hsjd.firebasestorage.app",
          messagingSenderId: "330248761061",
          appId: "1:330248761061:web:852e3b43fec2f8b83fae0c"
        };

        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.fb = { collection, addDoc, doc, setDoc, deleteDoc, onSnapshot, serverTimestamp };
    </script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [usuario, setUsuario] = useState(null);
            const [pinInput, setPinInput] = useState("");
            const [pinActualConfig, setPinActualConfig] = useState("1234"); // PIN por defecto
            const [medicoSeleccionado, setMedicoSeleccionado] = useState("");
            const [camas, setCamas] = useState([]);
            const [camaSeleccionada, setCamaSeleccionada] = useState(null);
            const [vistaActual, setVistaActual] = useState("listado"); // "listado" | "edicion" | "reportes" | "imprimir" | "cambiar_pin"
            const [busqueda, setBusqueda] = useState("");
            const [estadoSeleccionado, setEstadoSeleccionado] = useState("");
            const [gestionandoMedicos, setGestionandoMedicos] = useState(false);
            
            // Campos para cambio de PIN
            const [pinViejoInput, setPinViejoInput] = useState("");
            const [pinNuevoInput, setPinNuevoInput] = useState("");
            const [pinConfirmarInput, setPinConfirmarInput] = useState("");

            // Filtros de fecha para reportes
            const [fechaInicioRep, setFechaInicioRep] = useState("");
            const [fechaFinRep, setFechaFinRep] = useState("");

            const [medicos, setMedicos] = useState([
                "Dr. Cabezas Loría", "Dr. Castillo Amoretti", "Dr. Cruz Guzmán", 
                "Dr. Giraldo Noguera", "Dra. Herrera Garrido", "Dra. Leitón Solano", 
                "Dra. Méndez Marín", "Dr. Meza Aguilar", "Dra. Min Kim", 
                "Dr. Moreno Arroyo", "Dr. Rojas Vázquez", "Dra. Rodríguez Rojas", 
                "Dra. Sandí Ovares", "Dr. Sandoval Alfaro", "Dra. Secades Mesén", 
                "Dra. Zúñiga Villegas"
            ]);
            const [nuevoMedicoInput, setNuevoMedicoInput] = useState("");

            const salonesLista = [
                "Cirugía Mujeres", "Cirugía Hombres", "UEQ", "Urología", 
                "Oncología Mujeres", "Oncología Hombres", "Ortopedia", 
                "UCI Central", "UCI Qx", "UCI Neura", "Ginecología", "Medicina"
            ];

            const serviciosBase = [
                "UEQ", "Ortopedia", "Urología", "Cirugía General", 
                "Cirugía Tórax", "Neurocirugía", "Cirugía Cardíaca", 
                "Cirugía Plástica", "ORL", "Oftalmología", "Otro"
            ];

            const diagnosticosBase = [
                "Pie Diabético", "Aneurisma de Aorta", "Isquemia Aguda", 
                "Isquemia Crónica", "Trombosis Venosa Profunda aguda", 
                "Trauma Vascular", "Tromboembolismo Pulmonar", 
                "Acceso Vascular Hemodiálisis", "Várices Miembros inferiores", 
                "Opérculo Torácico", "Trombosis Venosa Profunda crónica", "Otro"
            ];

            const motivosInhabilitacion = [
                "Aislamiento por brote infeccioso", "Remodelación/Mantenimiento", 
                "Avería de mobiliario", "Limpieza/Desinfección"
            ];

            const camasInicialesVascular = [
                { numeroCama: "607", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "608", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "609", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "610", salon: "Cirugía Mujeres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "611", salon: "Cirugía Mujeres", tipoCama: "Propia Aorta", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "562", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "563", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "564", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "565", salon: "Cirugía Hombres", tipoCama: "Propia Regular", estadoCama: "Libre", paciente: "", idPaciente: "" },
                { numeroCama: "566", salon: "Cirugía Hombres", tipoCama: "Propia Aorta", estadoCama: "Libre", paciente: "", idPaciente: "" }
            ];

            // Sincronizar PIN y Camas desde Firebase en tiempo real
            useEffect(() => {
                if (window.fb) {
                    // Cargar PIN configurado en Firestore
                    const unsubConfig = window.fb.onSnapshot(window.fb.doc(window.db, "config", "seguridad"), (docSnap) => {
                        if (docSnap.exists() && docSnap.data().pin) {
                            setPinActualConfig(docSnap.data().pin);
                        } else {
                            // Crear configuración inicial con "1234" si no existe
                            window.fb.setDoc(window.fb.doc(window.db, "config", "seguridad"), { pin: "1234" });
                        }
                    });

                    // Cargar camas
                    const unsubCamas = window.fb.onSnapshot(window.fb.collection(window.db, "camas_vascular"), (snapshot) => {
                        const camasData = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                        if (camasData.length === 0) {
                            camasInicialesVascular.forEach(async (cama) => {
                                await window.fb.addDoc(window.fb.collection(window.db, "camas_vascular"), {
                                    ...cama,
                                    ultimoUsuario: "Sistema"
                                });
                            });
                        } else {
                            setCamas(camasData);
                        }
                    });

                    return () => {
                        unsubConfig();
                        unsubCamas();
                    };
                }
            }, []);

            const calcularDias = (fechaIngreso, fechaCirugia) => {
                if (!fechaIngreso) return { diasInternamiento: 0, diasPostOp: 0 };
                const hoy = new Date();
                hoy.setHours(0,0,0,0);
                const ingreso = new Date(fechaIngreso);
                ingreso.setHours(0,0,0,0);

                const diffIngresoMs = hoy - ingreso;
                const diasInternamiento = Math.max(1, Math.floor(diffIngresoMs / (1000 * 60 * 60 * 24)) + 1);

                if (!fechaCirugia) {
                    return { diasInternamiento, diasPostOp: 0 };
                }

                const cirugia = new Date(fechaCirugia);
                cirugia.setHours(0,0,0,0);

                if (hoy < cirugia) {
                    return { diasInternamiento, diasPostOp: 0 };
                } else if (hoy.getTime() === cirugia.getTime()) {
                    return { diasInternamiento, diasPostOp: 0 };
                } else {
                    const diasPost = Math.floor((hoy - cirugia) / (1000 * 60 * 60 * 24));
                    return { diasInternamiento, diasPostOp: Math.max(1, diasPost) };
                }
            };

            const guardarCama = async (e) => {
                e.preventDefault();
                const formData = new FormData(e.target);
                const datos = Object.fromEntries(formData.entries());

                const calculo = calcularDias(datos.fechaIngresoSalon, datos.fechaPrimeraCirugia);
                datos.diasPreOp = calculo.diasInternamiento;
                datos.diasPostOp = calculo.diasPostOp;
                datos.ultimoUsuario = usuario;
                datos.ultimaActualizacion = window.fb.serverTimestamp();

                try {
                    if (camaSeleccionada.id) {
                        await window.fb.setDoc(window.fb.doc(window.db, "camas_vascular", camaSeleccionada.id), datos, { merge: true });
                    } else {
                        await window.fb.addDoc(window.fb.collection(window.db, "camas_vascular"), datos);
                    }
                    setVistaActual("listado");
                    setCamaSeleccionada(null);
                } catch (error) {
                    alert("Error al guardar en la base de datos.");
                    console.error(error);
                }
            };

            const cambiarPinSistema = async (e) => {
                e.preventDefault();
                if (pinViejoInput !== pinActualConfig) {
                    alert("El PIN actual es incorrecto.");
                    return;
                }
                if (pinNuevoInput.length !== 4 || isNaN(pinNuevoInput)) {
                    alert("El nuevo PIN debe ser estrictamente de 4 dígitos numéricos.");
                    return;
                }
                if (pinNuevoInput !== pinConfirmarInput) {
                    alert("Los nuevos PINs no coinciden.");
                    return;
                }

                try {
                    await window.fb.setDoc(window.fb.doc(window.db, "config", "seguridad"), { pin: pinNuevoInput });
                    alert("¡PIN actualizado con éxito en la base de datos!");
                    setPinViejoInput("");
                    setPinNuevoInput("");
                    setPinConfirmarInput("");
                    setVistaActual("listado");
                } catch (err) {
                    alert("Error al actualizar el PIN.");
                    console.error(err);
                }
            };

            const agregarCamaExtra = () => {
                setCamaSeleccionada({
                    numeroCama: "",
                    salon: "Cirugía Mujeres",
                    tipoCama: "Invasión Ejercida",
                    estadoCama: "Invasión Ejercida por Vascular",
                    paciente: "",
                    idPaciente: "",
                    modalidadIngreso: "Emergencias",
                    listaEspera: "No",
                    diagnostico: "Pie Diabético",
                    fechaIngresoSalon: new Date().toISOString().split('T')[0],
                    fechaPrimeraCirugia: "",
                    ultimoUsuario: usuario
                });
                setEstadoSeleccionado("Invasión Ejercida por Vascular");
                setVistaActual("edicion");
            };

            const abrirEdicion = (cama) => {
                setCamaSeleccionada(cama);
                setEstadoSeleccionado(cama.estadoCama);
                setVistaActual("edicion");
            };

            const obtenerColorEstado = (estado) => {
                switch(estado) {
                    case "Ocupada por Vascular": return "bg-[#cfe2f3] border-l-blue-500 text-blue-950";
                    case "Invasión Ejercida por Vascular": return "bg-[#cbf7f7] border-l-cyan-500 text-cyan-950";
                    case "Invadida por otro servicio": return "bg-[#d9ead3] border-l-emerald-500 text-emerald-950";
                    case "Libre": return "bg-[#fff2cc] border-l-yellow-500 text-yellow-950";
                    case "Desocupada": return "bg-[#f4cccc] border-l-pink-500 text-pink-950";
                    case "Inhabilitada": return "bg-[#fce5cd] border-l-orange-500 text-orange-950";
                    default: return "bg-white border-l-gray-300 text-gray-900";
                }
            };

            const ordenarCamasLogica = (a, b) => {
                const numA = parseInt(a.numeroCama);
                const numB = parseInt(b.numeroCama);
                const esIcuA = isNaN(numA) || (a.salon && a.salon.includes("UCI"));
                const esIcuB = isNaN(numB) || (b.salon && b.salon.includes("UCI"));

                if (esIcuA && !esIcuB) return 1;
                if (!esIcuA && esIcuB) return -1;
                if (esIcuA && esIcuB) {
                    return a.numeroCama.localeCompare(b.numeroCama, undefined, {numeric: true});
                }
                return numA - numB;
            };

            if (!usuario) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-slate-900 p-4">
                        <div className="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md">
                            <h1 className="text-xl font-bold mb-1 text-blue-900 text-center">Hospital San Juan de Dios</h1>
                            <h2 className="text-md font-semibold mb-6 text-gray-600 text-center">Censo Cirugía Vascular</h2>
                            
                            <div className="mb-4 flex justify-between items-center">
                                <label className="text-sm font-bold text-gray-700">Seleccione Médico:</label>
                                <button onClick={() => setGestionandoMedicos(!gestionandoMedicos)} className="text-xs text-blue-600 font-semibold hover:underline">
                                    {gestionandoMedicos ? "Ocultar gestión" : "Gestionar médicos (Rotaciones)"}
                                </button>
                            </div>

                            {gestionandoMedicos && (
                                <div className="mb-4 p-3 bg-gray-50 rounded-lg border text-sm">
                                    <p className="text-xs text-gray-500 mb-2">Agregue o elimine médicos para las rotaciones mensuales:</p>
                                    <div className="flex gap-2 mb-2">
                                        <input type="text" placeholder="Ej. Dr. Nuevo Médico" value={nuevoMedicoInput} onChange={(e) => setNuevoMedicoInput(e.target.value)} className="w-full p-1.5 border rounded text-xs" />
                                        <button onClick={() => {
                                            if(nuevoMedicoInput.trim()) {
                                                const actualizado = [...medicos, nuevoMedicoInput.trim()].sort();
                                                setMedicos(actualizado);
                                                setNuevoMedicoInput("");
                                            }
                                        }} className="bg-blue-600 text-white px-3 py-1 rounded text-xs font-bold">+</button>
                                    </div>
                                    <div className="max-h-32 overflow-y-auto space-y-1">
                                        {medicos.map((m, idx) => (
                                            <div key={idx} className="flex justify-between items-center bg-white p-1 rounded border text-xs">
                                                <span>{m}</span>
                                                <button onClick={() => setMedicos(medicos.filter(item => item !== m))} className="text-red-600 font-bold px-1">×</button>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            <select className="w-full p-3 mb-4 border rounded-lg bg-gray-50" value={medicoSeleccionado} onChange={(e) => setMedicoSeleccionado(e.target.value)}>
                                <option value="">Seleccione Médico...</option>
                                {medicos.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>

                            <input type="password" placeholder="PIN de 4 dígitos" className="w-full p-3 mb-6 border rounded-lg text-center tracking-widest text-lg bg-gray-50" maxLength="4" value={pinInput} onChange={(e) => setPinInput(e.target.value)} />

                            <button className="w-full bg-blue-700 text-white font-bold py-3 px-4 rounded-lg hover:bg-blue-800 transition"
                                onClick={() => {
                                    if(medicoSeleccionado && pinInput === pinActualConfig) setUsuario(medicoSeleccionado);
                                    else alert("PIN incorrecto o médico no seleccionado");
                                }}>
                                Ingresar al Censo
                            </button>
                        </div>
                    </div>
                );
            }

            const camasFiltradas = camas.filter(c => 
                (c.paciente && c.paciente.toLowerCase().includes(busqueda.toLowerCase())) ||
                (c.numeroCama && c.numeroCama.toLowerCase().includes(busqueda.toLowerCase())) ||
                (c.salon && c.salon.toLowerCase().includes(busqueda.toLowerCase()))
            ).sort(ordenarCamasLogica);

            const camasFiltradasPorFecha = camas.filter(c => {
                if (!fechaInicioRep || !fechaFinRep) return true;
                if (!c.fechaIngresoSalon) return false;
                return c.fechaIngresoSalon >= fechaInicioRep && c.fechaIngresoSalon <= fechaFinRep;
            });

            const estadisticasReporte = () => {
                let diasOcupadaVascular = 0;
                let diasInvadidas = 0;
                let diasInvasionEjercida = 0;
                let arrPre = [];
                let arrPost = [];

                camasFiltradasPorFecha.forEach(c => {
                    const calc = calcularDias(c.fechaIngresoSalon, c.fechaPrimeraCirugia);
                    if (c.estadoCama === "Ocupada por Vascular") diasOcupadaVascular += calc.diasInternamiento;
                    if (c.estadoCama === "Invadida por otro servicio") diasInvadidas += calc.diasInternamiento;
                    if (c.estadoCama === "Invasión Ejercida por Vascular") diasInvasionEjercida += calc.diasInternamiento;

                    arrPre.push(calc.diasInternamiento);
                    if (typeof calc.diasPostOp === 'number' && calc.diasPostOp > 0) arrPost.push(calc.diasPostOp);
                });

                const minMaxAvg = (arr) => {
                    if (arr.length === 0) return { min: 0, max: 0, avg: 0 };
                    const min = Math.min(...arr);
                    const max = Math.max(...arr);
                    const sum = arr.reduce((a, b) => a + b, 0);
                    return { min, max, avg: (sum / arr.length).toFixed(1) };
                };

                return {
                    diasOcupadaVascular,
                    diasInvadidas,
                    diasInvasionEjercida,
                    pre: minMaxAvg(arrPre),
                    post: minMaxAvg(arrPost)
                };
            };

            const stats = estadisticasReporte();

            return (
                <div className="min-h-screen bg-gray-100 flex flex-col">
                    {/* Barra Superior estilo Power Apps */}
                    <header className="bg-[#0078D4] text-white p-4 shadow flex justify-between items-center no-print">
                        <div className="flex items-center gap-4">
                            <h1 className="text-xl font-bold tracking-wide">Censo_Camas_Vascular</h1>
                            <div className="flex gap-2">
                                <button onClick={() => setVistaActual("listado")} className={`px-3 py-1.5 rounded text-sm font-bold ${vistaActual === 'listado' ? 'bg-white/20' : 'hover:bg-white/10'}`}>Censo Activo</button>
                                <button onClick={() => setVistaActual("reportes")} className={`px-3 py-1.5 rounded text-sm font-bold ${vistaActual === 'reportes' ? 'bg-white/20' : 'hover:bg-white/10'}`}>Analítica y Reportes</button>
                                <button onClick={() => setVistaActual("imprimir")} className={`px-3 py-1.5 rounded text-sm font-bold ${vistaActual === 'imprimir' ? 'bg-white/20' : 'hover:bg-white/10'}`}>Vista Imprimir / PDF</button>
                                <button onClick={() => setVistaActual("cambiar_pin")} className={`px-3 py-1.5 rounded text-sm font-bold ${vistaActual === 'cambiar_pin' ? 'bg-white/20' : 'hover:bg-white/10'}`}>Cambiar PIN</button>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <span className="text-sm bg-white/10 px-3 py-1 rounded">Dr(a). {usuario}</span>
                            <button onClick={() => { setUsuario(null); setPinInput(""); }} className="bg-red-600 hover:bg-red-700 px-3 py-1.5 rounded text-sm font-bold transition">
                                Salir
                            </button>
                        </div>
                    </header>

                    {/* VISTA 1: LISTADO DE CAMAS */}
                    {vistaActual === "listado" && (
                        <div className="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col">
                            <div className="mb-4 flex gap-3">
                                <input 
                                    type="text" 
                                    placeholder="Buscar por paciente, cama o salón..." 
                                    value={busqueda} 
                                    onChange={(e) => setBusqueda(e.target.value)}
                                    className="flex-1 p-3 border rounded-lg text-sm bg-white shadow-sm"
                                />
                                <button onClick={agregarCamaExtra} className="bg-[#0078D4] hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-lg text-sm shadow transition flex items-center justify-center gap-1 whitespace-nowrap">
                                    <span className="text-lg">+</span> Cama Extra
                                </button>
                            </div>

                            <div className="space-y-3">
                                {camasFiltradas.map(cama => {
                                    const colorClase = obtenerColorEstado(cama.estadoCama);
                                    const calc = calcularDias(cama.fechaIngresoSalon, cama.fechaPrimeraCirugia);
                                    const esAorta = cama.numeroCama === "611" || cama.numeroCama === "566" || cama.tipoCama === "Propia Aorta";

                                    return (
                                        <div 
                                            key={cama.id} 
                                            onClick={() => abrirEdicion(cama)}
                                            className={`p-4 rounded-xl border-l-8 shadow-sm cursor-pointer transition transform active:scale-95 ${colorClase} hover:shadow-md`}
                                        >
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <div className="flex items-center gap-2">
                                                        <h4 className="font-bold text-gray-900 text-lg">{cama.paciente || <span className="text-gray-400 italic font-normal">Sin asignar</span>}</h4>
                                                        {esAorta && (
                                                            <span className="bg-purple-700 text-white text-[10px] font-extrabold px-2 py-0.5 rounded tracking-wider uppercase shadow-sm">
                                                                CAMA AORTA
                                                            </span>
                                                        )}
                                                    </div>
                                                    <div className="text-sm font-semibold text-gray-700 mt-1 flex gap-3">
                                                        <span>Cama: <strong className="text-base font-extrabold">{cama.numeroCama}</strong></span>
                                                        <span>• {cama.salon}</span>
                                                        <span className="text-xs text-gray-500 font-mono self-center">({cama.idPaciente || "Sin cédula"})</span>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <span className="text-xs font-bold text-blue-900 block">Días internamiento:</span>
                                                    <span className="text-xl font-extrabold text-blue-700">{calc.diasInternamiento}</span>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    )}

                    {/* VISTA 2: EDICIÓN DE CAMA */}
                    {vistaActual === "edicion" && camaSeleccionada && (
                        <div className="flex-1 max-w-3xl w-full mx-auto p-4">
                            <div className="bg-white rounded-xl shadow-lg border p-6 my-4">
                                <div className="flex justify-between items-center border-b pb-4 mb-6">
                                    <button onClick={() => setVistaActual("listado")} className="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold px-4 py-2 rounded-lg text-sm transition">
                                        ← Volver al listado de camas
                                    </button>
                                    <h2 className="text-xl font-bold text-blue-900">
                                        {camaSeleccionada.id ? `Editar Cama ${camaSeleccionada.numeroCama}` : "Registrar Cama Extra"}
                                    </h2>
                                </div>

                                <form onSubmit={guardarCama} className="space-y-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Número de Cama</label>
                                            <input name="numeroCama" defaultValue={camaSeleccionada.numeroCama} required className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 font-bold" placeholder="Ej. 401 o UCI 1" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Salón</label>
                                            <select name="salon" defaultValue={camaSeleccionada.salon || salonesLista[0]} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                                                {salonesLista.map(s => <option key={s} value={s}>{s}</option>)}
                                            </select>
                                        </div>

                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Estado de Cama</label>
                                            <select name="estadoCama" defaultValue={camaSeleccionada.estadoCama || "Libre"} onChange={(e) => setEstadoSeleccionado(e.target.value)} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 font-semibold">
                                                <option value="Ocupada por Vascular">Ocupada por Vascular</option>
                                                <option value="Invasión Ejercida por Vascular">Invasión Ejercida por Vascular</option>
                                                <option value="Invadida por otro servicio">Invadida por otro servicio</option>
                                                <option value="Libre">Libre</option>
                                                <option value="Desocupada">Desocupada</option>
                                                <option value="Inhabilitada">Inhabilitada</option>
                                            </select>
                                        </div>

                                        {(estadoSeleccionado === "Inhabilitada" || camaSeleccionada.estadoCama === "Inhabilitada") && (
                                            <div className="md:col-span-2 bg-orange-50 p-3 rounded-lg border border-orange-200">
                                                <label className="block text-xs font-bold text-orange-900 uppercase mb-1">Motivo de Inhabilitación</label>
                                                <select name="motivoInhabilitacion" defaultValue={camaSeleccionada.motivoInhabilitacion || motivosInhabilitacion[0]} className="w-full p-2.5 border rounded-lg text-sm bg-white">
                                                    {motivosInhabilitacion.map(m => <option key={m} value={m}>{m}</option>)}
                                                </select>
                                            </div>
                                        )}

                                        {(estadoSeleccionado === "Invadida por otro servicio" || camaSeleccionada.estadoCama === "Invadida por otro servicio") && (
                                            <div className="md:col-span-2 bg-emerald-50 p-3 rounded-lg border border-emerald-200">
                                                <label className="block text-xs font-bold text-emerald-900 uppercase mb-1">Servicio que Invade</label>
                                                <select name="servicioInvasor" defaultValue={camaSeleccionada.servicioInvasor || serviciosBase[0]} className="w-full p-2.5 border rounded-lg text-sm bg-white">
                                                    {serviciosBase.map(s => <option key={s} value={s}>{s}</option>)}
                                                </select>
                                            </div>
                                        )}

                                        <div className="md:col-span-2">
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Nombre de Paciente</label>
                                            <input name="paciente" defaultValue={camaSeleccionada.paciente} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50" placeholder="Apellidos y Nombre" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Identificación / Expediente</label>
                                            <input name="idPaciente" defaultValue={camaSeleccionada.idPaciente} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50 font-mono" placeholder="Cédula" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Diagnóstico</label>
                                            <select name="diagnostico" defaultValue={camaSeleccionada.diagnostico || diagnosticosBase[0]} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                                                {diagnosticosBase.map(d => <option key={d} value={d}>{d}</option>)}
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Tipo de Cama</label>
                                            <select name="tipoCama" defaultValue={camaSeleccionada.tipoCama || "Propia Regular"} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                                                <option value="Propia Regular">Propia Regular</option>
                                                <option value="Propia Aorta">Propia Aorta</option>
                                                <option value="Invasión Ejercida">Invasión Ejercida</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Modalidad de Ingreso</label>
                                            <select name="modalidadIngreso" defaultValue={camaSeleccionada.modalidadIngreso || "Emergencias"} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50">
                                                <option value="Emergencias">Emergencias</option>
                                                <option value="Consulta Externa">Consulta Externa</option>
                                            </select>
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Fecha Ingreso a Salón</label>
                                            <input type="date" name="fechaIngresoSalon" defaultValue={camaSeleccionada.fechaIngresoSalon || ""} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50" />
                                        </div>

                                        <div>
                                            <label className="block text-xs font-bold text-gray-600 uppercase mb-1">Fecha Primera Cirugía</label>
                                            <input type="date" name="fechaPrimeraCirugia" defaultValue={camaSeleccionada.fechaPrimeraCirugia || ""} className="w-full p-2.5 border rounded-lg text-sm bg-gray-50" />
                                        </div>

                                        <div className="flex items-center justify-between p-3 bg-gray-50 rounded-lg border md:col-span-2">
                                            <div>
                                                <span className="text-xs font-bold text-gray-700 uppercase block">Lista de Espera</span>
                                            </div>
                                            <select name="listaEspera" defaultValue={camaSeleccionada.listaEspera || "No"} className="p-2 border rounded text-sm font-bold bg-white">
                                                <option value="No">No</option>
                                                <option value="Sí">Sí</option>
                                            </select>
                                        </div>
                                    </div>

                                    <div className="flex justify-end gap-3 pt-4 border-t mt-4">
                                        {camaSeleccionada.tipoCama !== "Propia Regular" && camaSeleccionada.tipoCama !== "Propia Aorta" && camaSeleccionada.id && (
                                            <button type="button" onClick={async () => {
                                                if(confirm("¿Eliminar esta cama extra / invasión ejercida?")) {
                                                    await window.fb.deleteDoc(window.fb.doc(window.db, "camas_vascular", camaSeleccionada.id));
                                                    setVistaActual("listado");
                                                }
                                            }} className="bg-red-100 text-red-700 hover:bg-red-200 px-4 py-2 rounded-lg font-bold text-sm mr-auto">
                                                Eliminar Cama
                                            </button>
                                        )}
                                        <button type="button" onClick={() => setVistaActual("listado")} className="bg-gray-200 hover:bg-gray-300 px-5 py-2.5 rounded-lg font-bold text-sm">
                                            Cancelar
                                        </button>
                                        <button type="submit" className="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-2.5 rounded-lg text-sm shadow">
                                            Guardar Cambios
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* VISTA 3: ANALÍTICA Y REPORTES */}
                    {vistaActual === "reportes" && (
                        <div className="flex-1 max-w-5xl w-full mx-auto p-6">
                            <div className="bg-white rounded-xl shadow-md p-6">
                                <h2 className="text-xl font-bold text-blue-900 mb-4">Consolidado de Indicadores y Reportes</h2>
                                
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-blue-50 p-4 rounded-lg border border-blue-100">
                                    <div>
                                        <label className="block text-xs font-bold text-blue-900 uppercase mb-1">Fecha Desde:</label>
                                        <input type="date" value={fechaInicioRep} onChange={(e) => setFechaInicioRep(e.target.value)} className="w-full p-2 border rounded bg-white text-sm" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-blue-900 uppercase mb-1">Fecha Hasta:</label>
                                        <input type="date" value={fechaFinRep} onChange={(e) => setFechaFinRep(e.target.value)} className="w-full p-2 border rounded bg-white text-sm" />
                                    </div>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                    <div className="bg-blue-100 p-4 rounded-xl border border-blue-200">
                                        <span className="text-xs font-bold text-blue-800 uppercase block">Días Ocupadas x Vascular</span>
                                        <span className="text-3xl font-extrabold text-blue-950 mt-1 block">{stats.diasOcupadaVascular}</span>
                                    </div>
                                    <div className="bg-emerald-100 p-4 rounded-xl border border-emerald-200">
                                        <span className="text-xs font-bold text-emerald-800 uppercase block">Días Camas Invadidas (Otros)</span>
                                        <span className="text-3xl font-extrabold text-emerald-950 mt-1 block">{stats.diasInvadidas}</span>
                                    </div>
                                    <div className="bg-cyan-100 p-4 rounded-xl border border-cyan-200">
                                        <span className="text-xs font-bold text-cyan-800 uppercase block">Días Invasión Ejercida</span>
                                        <span className="text-3xl font-extrabold text-cyan-950 mt-1 block">{stats.diasInvasionEjercida}</span>
                                    </div>
                                </div>

                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-gray-100 border-b text-xs font-bold text-gray-700 uppercase">
                                                <th className="p-3">Métrica Quirúrgica</th>
                                                <th className="p-3">Mínimo</th>
                                                <th className="p-3">Máximo</th>
                                                <th className="p-3">Promedio</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y text-sm">
                                            <tr>
                                                <td className="p-3 font-semibold">Días Pre-Quirúrgicos / Estancia</td>
                                                <td className="p-3">{stats.pre.min}</td>
                                                <td className="p-3">{stats.pre.max}</td>
                                                <td className="p-3 font-bold text-blue-700">{stats.pre.avg}</td>
                                            </tr>
                                            <tr>
                                                <td className="p-3 font-semibold">Días Pos-Quirúrgicos</td>
                                                <td className="p-3">{stats.post.min}</td>
                                                <td className="p-3">{stats.post.max}</td>
                                                <td className="p-3 font-bold text-blue-700">{stats.post.avg}</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* VISTA 4: IMPRESIÓN / PDF CENSO DIARIO */}
                    {vistaActual === "imprimir" && (
                        <div className="flex-1 max-w-6xl w-full mx-auto p-6 bg-white my-4 rounded-xl shadow">
                            <div className="flex justify-between items-center mb-6 no-print">
                                <h2 className="text-xl font-bold text-blue-900">Vista Previa para Impresión (Censo Diario)</h2>
                                <button onClick={() => window.print()} className="bg-blue-700 text-white font-bold px-5 py-2 rounded-lg text-sm shadow hover:bg-blue-800">
                                    Imprimir / Guardar PDF
                                </button>
                            </div>

                            <div className="text-center mb-6">
                                <h3 className="text-lg font-bold text-gray-900">HOSPITAL SAN JUAN DE DIOS</h3>
                                <h4 className="text-md font-semibold text-gray-700">SERVICIO DE CIRUGÍA VASCULAR - CENSO DIARIO DE CAMAS</h4>
                                <p className="text-xs text-gray-500 mt-1">Fecha de emisión: {new Date().toLocaleDateString()}</p>
                            </div>

                            <table className="w-full text-left border-collapse border border-gray-300 text-xs">
                                <thead>
                                    <tr className="bg-gray-200 border-b border-gray-300 text-gray-800">
                                        <th className="border p-2">Cama</th>
                                        <th className="border p-2">Salón</th>
                                        <th className="border p-2">Paciente</th>
                                        <th className="border p-2">Cédula / Exp</th>
                                        <th className="border p-2">Estado</th>
                                        <th className="border p-2">Diagnóstico</th>
                                        <th className="border p-2">Días Int.</th>
                                        <th className="border p-2">1ra Cirugía</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-gray-200">
                                    {camasFiltradas.map(c => {
                                        const calc = calcularDias(c.fechaIngresoSalon, c.fechaPrimeraCirugia);
                                        return (
                                            <tr key={c.id} className="hover:bg-gray-50">
                                                <td className="border p-2 font-bold">{c.numeroCama}</td>
                                                <td className="border p-2">{c.salon}</td>
                                                <td className="border p-2 font-semibold">{c.paciente || "Sin asignar"}</td>
                                                <td className="border p-2 font-mono">{c.idPaciente || "N/A"}</td>
                                                <td className="border p-2">{c.estadoCama}</td>
                                                <td className="border p-2">{c.diagnostico}</td>
                                                <td className="border p-2 text-center font-bold">{calc.diasInternamiento}</td>
                                                <td className="border p-2 text-center">{c.fechaPrimeraCirugia || "Pendiente"}</td>
                                            </tr>
                                        );
                                    })}
                                </tbody>
                            </table>
                        </div>
                    )}

                    {/* VISTA 5: CAMBIAR CONTRASEÑA / PIN */}
                    {vistaActual === "cambiar_pin" && (
                        <div className="flex-1 max-w-md w-full mx-auto p-4 flex items-center justify-center">
                            <div className="bg-white rounded-xl shadow-lg border p-6 w-full">
                                <h2 className="text-xl font-bold text-blue-900 mb-2 text-center">Cambiar PIN de Acceso</h2>
                                <p className="text-xs text-gray-500 mb-6 text-center">Esta contraseña es utilizada por todo el personal médico para ingresar al sistema.</p>

                                <form onSubmit={cambiarPinSistema} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 uppercase mb-1">PIN Actual</label>
                                        <input type="password" maxLength="4" required value={pinViejoInput} onChange={(e) => setPinViejoInput(e.target.value)} className="w-full p-2.5 border rounded-lg text-center tracking-widest text-lg bg-gray-50" placeholder="••••" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Nuevo PIN (4 dígitos)</label>
                                        <input type="password" maxLength="4" required value={pinNuevoInput} onChange={(e) => setPinNuevoInput(e.target.value)} className="w-full p-2.5 border rounded-lg text-center tracking-widest text-lg bg-gray-50" placeholder="••••" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold text-gray-700 uppercase mb-1">Confirmar Nuevo PIN</label>
                                        <input type="password" maxLength="4" required value={pinConfirmarInput} onChange={(e) => setPinConfirmarInput(e.target.value)} className="w-full p-2.5 border rounded-lg text-center tracking-widest text-lg bg-gray-50" placeholder="••••" />
                                    </div>

                                    <div className="flex gap-2 pt-4">
                                        <button type="button" onClick={() => setVistaActual("listado")} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2.5 rounded-lg text-sm transition">
                                            Cancelar
                                        </button>
                                        <button type="submit" className="flex-1 bg-blue-700 hover:bg-blue-800 text-white font-bold py-2.5 rounded-lg text-sm shadow transition">
                                            Actualizar PIN
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
