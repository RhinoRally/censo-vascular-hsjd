<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Censo Vascular HSJD</title>
    <!-- Tailwind CSS para diseño moderno -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React y ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel para compilar React en el navegador -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-gray-100">
    <div id="root"></div>

    <!-- MÓDULO DE FIREBASE -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.5.0/firebase-firestore.js";

       const firebaseConfig = {
  apiKey: "AIzaSyD6cmfArqhgLdW0dn_NAIT9CUMBcT5rW1U",
  authDomain: "censo-vascular-hsjd.firebaseapp.com",
  projectId: "censo-vascular-hsjd",
  storageBucket: "censo-vascular-hsjd.firebasestorage.app",
  messagingSenderId: "330248761061",
  appId: "1:330248761061:web:852e3b43fec2f8b83fae0c"
} 

        // Inicialización y exportación global para React
        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.fb = { collection, doc, setDoc, updateDoc, onSnapshot, serverTimestamp };
    </script>

    <!-- APLICACIÓN REACT (INTERFAZ Y LÓGICA) -->
    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [usuario, setUsuario] = useState(null);
            const [pinInput, setPinInput] = useState("");
            const [medicoSeleccionado, setMedicoSeleccionado] = useState("");
            
            // Catálogo básico de prueba (luego se enlazará a Firestore)
            const medicos = ["Dr. Rojas", "Dr. Residente 1", "Dra. Asistente"];
            const PIN_CORRECTO = "1234"; // Simplificado para la prueba inicial

            // Pantalla de Login (Autenticación Local)
            if (!usuario) {
                return (
                    <div className="flex items-center justify-center min-h-screen bg-slate-800">
                        <div className="bg-white p-8 rounded-lg shadow-lg w-96 text-center">
                            <h1 className="text-2xl font-bold mb-2 text-blue-900">Hospital San Juan de Dios</h1>
                            <h2 className="text-lg mb-6 text-gray-600">Censo Cirugía Vascular</h2>
                            
                            <select 
                                className="w-full p-2 mb-4 border rounded"
                                value={medicoSeleccionado}
                                onChange={(e) => setMedicoSeleccionado(e.target.value)}
                            >
                                <option value="">Seleccione Médico...</option>
                                {medicos.map(m => <option key={m} value={m}>{m}</option>)}
                            </select>

                            <input 
                                type="password" 
                                placeholder="PIN de 4 dígitos" 
                                className="w-full p-2 mb-4 border rounded text-center tracking-widest text-lg"
                                maxLength="4"
                                value={pinInput}
                                onChange={(e) => setPinInput(e.target.value)}
                            />

                            <button 
                                className="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700"
                                onClick={() => {
                                    if(medicoSeleccionado && pinInput === PIN_CORRECTO) setUsuario(medicoSeleccionado);
                                    else alert("PIN incorrecto o médico no seleccionado");
                                }}
                            >
                                Entrar al Censo
                            </button>
                        </div>
                    </div>
                );
            }

            // Pantalla Principal (Censo y Reportes)
            return (
                <div className="p-4 max-w-6xl mx-auto">
                    <div className="flex justify-between items-center mb-6 bg-white p-4 rounded shadow">
                        <h1 className="text-xl font-bold text-blue-900">Censo Activo - Vascular</h1>
                        <div className="flex items-center gap-4">
                            <span className="text-sm font-semibold text-gray-700">Usuario: {usuario}</span>
                            <button 
                                onClick={() => { setUsuario(null); setPinInput(""); }}
                                className="bg-red-500 text-white px-3 py-1 rounded text-sm hover:bg-red-600"
                            >
                                Cerrar Sesión
                            </button>
                        </div>
                    </div>

                    {/* Plantilla de Cama (Ejemplo Visual) */}
                    <div className="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                        <div className="flex justify-between">
                            <h3 className="font-bold text-lg">Cama 401 - Salón de Hombres</h3>
                            <button className="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm font-semibold hover:bg-blue-200">
                                Editar Cama
                            </button>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-4 text-sm">
                            <div><strong>Origen:</strong> Emergencias</div>
                            <div><strong>Días Pre-Op:</strong> 2</div>
                            <div><strong>Días Post-Op:</strong> 0</div>
                            <div><strong>Lista Espera:</strong> Sí</div>
                            <div className="col-span-2"><strong>Diagnóstico:</strong> Pie diabético Wagner 3</div>
                            <div className="col-span-2"><strong>Invasiones:</strong> VVC, Sonda Foley</div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
